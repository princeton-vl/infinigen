name: Integration Render

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to tag outputs and comment on"
        required: false
        type: string

concurrency:
  # Per-PR group (re-push supersedes); per-SHA push group so baseline runs are never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RENDER_ARCHIVE_ROOT: /home/renderbot/integration_test_archive/renders/integration
  VIEWER_BASE_URL: https://pvlbox.princeton.edu

jobs:
  render:
    if: github.repository == 'princeton-vl/infinigen_internal' && github.event.pull_request.draft == false
    runs-on: [self-hosted, renderbot]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Install infinigen & dependencies
        run: |
          uv venv
          uv pip install -e ".[dev,vis]"

      # Resolve every path/label this run needs, once, so the render / archive /
      # report steps below are just simple consumers of these env vars.
      - name: Resolve run metadata
        run: |
          set -e
          # On a PR this is the PR number; via workflow_dispatch it's the input;
          # on a branch push it's empty (RUN_LABEL stays "nopr").
          PR_NUMBER="${{ github.event.pull_request.number || inputs.pr_number }}"
          RUN_LABEL="nopr"
          [ -n "$PR_NUMBER" ] && RUN_LABEL="pr${PR_NUMBER}"

          REL_PATH="$(date -u +'%Y-%m-%dT%H-%M-%SZ')_${GITHUB_SHA:0:7}"

          # Baseline to diff against in the viewer: the PR's target branch
          # (<base>_latest), falling back to develop_latest when that branch has
          # no baseline yet. base_ref is empty for push / dispatch, so those keep
          # develop_latest.
          BASELINE="develop_latest"
          BASE_REF="${{ github.base_ref }}"
          if [ -n "$BASE_REF" ] && [ -e "$RENDER_ARCHIVE_ROOT/${BASE_REF}_latest" ]; then
            BASELINE="${BASE_REF}_latest"
          fi

          {
            echo "REL_PATH=$REL_PATH"
            echo "OUTPUT_DIR=$RUNNER_TEMP/integration-renders-${RUN_LABEL}-${REL_PATH}"
            echo "TARGET_DIR=$RENDER_ARCHIVE_ROOT/$REL_PATH"
            echo "BASELINE=$BASELINE"
            echo "BASELINE_COVERAGE=$RENDER_ARCHIVE_ROOT/$BASELINE/asset_coverage.json"
          } >> "$GITHUB_ENV"

      # Gating runs before any GPU work, so say what the render covers up front.
      - name: Announce planned renders
        if: ${{ github.event.pull_request.number || inputs.pr_number }}
        continue-on-error: true
        env:
          INFINIGEN_CHANGED_ONLY: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' && vars.INTEGRATION_CHANGED_ONLY || '' }}
          COVERAGE_BASE_REF: origin/${{ github.base_ref }}
          ASSET_COVERAGE_BASELINE: ${{ env.BASELINE_COVERAGE }}
        run: |
          set -e
          mkdir -p "$OUTPUT_DIR"
          uv run python scripts/integration_v2/launch_andromeda.py \
            --output_path "$OUTPUT_DIR" \
            --dry-run
          uv run python scripts/integration_v2/compose_pr_comment.py \
            --phase planned \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --gating-report "$OUTPUT_DIR/gating_report.json" \
            --out "$RUNNER_TEMP/planned_body.md"

      - name: Post planned render comment
        if: ${{ github.event.pull_request.number || inputs.pr_number }}
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          BODY_FILE: planned_body.md
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          script: |
            const sticky = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/sticky_comment.js`);
            await sticky({github, context});

      - name: Run integration renders
        id: render
        continue-on-error: true
        env:
          GPU_MEM_USED_MAX_MB: 10000
          GIT_BRANCH_OVERRIDE: ${{ github.head_ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          MATERIAL_PARALLEL: 1
          MATERIAL_LIMIT: -1
          OBJECT_LIMIT: -1
          SCENE_LIMIT: -1
          INFINIGEN_COVERAGE: 1
          # Gate only PRs to non-main; pushes (baseline) + dispatch + PRs to main render all
          INFINIGEN_CHANGED_ONLY: ${{ github.event_name == 'pull_request' && github.base_ref != 'main' && vars.INTEGRATION_CHANGED_ONLY || '' }}
          COVERAGE_BASE_REF: origin/${{ github.base_ref }}
          ASSET_COVERAGE_BASELINE: ${{ env.BASELINE_COVERAGE }}
        run: |
          set -e
          mkdir -p "$OUTPUT_DIR"
          uv run python scripts/integration_v2/launch_andromeda.py \
            --output_path "$OUTPUT_DIR" \
            --jobs-per-gpu 4 \
            --gpus available

      - name: Reduce per-asset coverage
        if: always()
        run: |
          uv run python scripts/integration_v2/reduce_coverage.py \
            "$OUTPUT_DIR/coverage_data" \
            --out-json "$OUTPUT_DIR/asset_coverage.json" \
            --out-xml coverage.xml || true

      - name: Upload coverage artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: |
            coverage.xml
            ${{ env.OUTPUT_DIR }}/asset_coverage.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Pixel diff vs baseline
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          uv run python scripts/integration_v2/baseline_diff.py pixel \
            --pr "$OUTPUT_DIR" \
            --baseline "$RENDER_ARCHIVE_ROOT/$BASELINE" \
            --report "$OUTPUT_DIR/pixel_diff.json" \
            --summary "$OUTPUT_DIR/pixel_diff.md"

      - name: Perf diff vs baseline
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          uv run python scripts/integration_v2/baseline_diff.py perf \
            --pr "$OUTPUT_DIR" \
            --baseline "$RENDER_ARCHIVE_ROOT/$BASELINE" \
            --report "$OUTPUT_DIR/perf_diff.json" \
            --summary "$OUTPUT_DIR/perf_diff.md"

      - name: Archive renders to permanent storage
        if: ${{ !cancelled() }}
        run: |
          set -e
          # Skip (don't fail) when the render produced no output — e.g. it
          # crashed before writing anything. This also guards against an empty
          # OUTPUT_DIR turning `rsync -a "$OUTPUT_DIR"/ ...` into `rsync -a / ...`,
          # which would copy the whole filesystem until the disk fills.
          if [ ! -d "$OUTPUT_DIR" ] || [ -z "$(ls -A "$OUTPUT_DIR" 2>/dev/null)" ]; then
            echo "No render output at '$OUTPUT_DIR' — nothing to archive."
            exit 0
          fi

          mkdir -p "$TARGET_DIR"
          rsync -a --exclude coverage_data "$OUTPUT_DIR"/ "$TARGET_DIR"/

          # Push to a tracked branch repoints <branch>_latest so later PRs diff against fresh renders.
          if [ "${{ github.event_name }}" = "push" ]; then
            ln -sfn "$TARGET_DIR" "$RENDER_ARCHIVE_ROOT/${{ github.ref_name }}_latest"
          fi

      - name: Print viewer link
        if: always()
        run: |
          echo "Integration renders are ready:"
          echo "${VIEWER_BASE_URL}/?v=${REL_PATH}"
          echo "${VIEWER_BASE_URL}/?v=${BASELINE}&v=${REL_PATH}"
          echo "Path: ${TARGET_DIR}"

      - name: Compose PR comment
        if: ${{ !cancelled() && (github.event.pull_request.number || inputs.pr_number) }}
        run: |
          uv run python scripts/integration_v2/compose_pr_comment.py \
            --phase done \
            --viewer-base "$VIEWER_BASE_URL" \
            --rel-path "$REL_PATH" \
            --baseline "$BASELINE" \
            --target-dir "$TARGET_DIR" \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --gating-report "$OUTPUT_DIR/gating_report.json" \
            --pixel-summary "$OUTPUT_DIR/pixel_diff.md" \
            --perf-summary "$OUTPUT_DIR/perf_diff.md" \
            --render-index "$OUTPUT_DIR" \
            --out "$RUNNER_TEMP/comment_body.md"

      - name: Comment PR with viewer link
        if: ${{ !cancelled() && (github.event.pull_request.number || inputs.pr_number) }}
        uses: actions/github-script@v7
        env:
          BODY_FILE: comment_body.md
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          script: |
            const sticky = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/sticky_comment.js`);
            await sticky({github, context});

      - name: Fail job if any render failed
        if: always()
        run: |
          if [ "${{ steps.render.outcome }}" = "failure" ]; then
            echo "One or more renders failed — marking job red."
            exit 1
          fi
