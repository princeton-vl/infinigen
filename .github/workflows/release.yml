name: Release

on:
  push:
    tags:
      - '[0-9]*'
      - 'v[0-9]*'

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    if: github.repository == 'princeton-vl/infinigen'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.3"
      - run: uv build
        env:
          INFINIGEN_MINIMAL_INSTALL: "True"
      - run: uv publish --trusted-publishing always
