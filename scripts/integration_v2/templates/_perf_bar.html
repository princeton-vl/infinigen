{% macro perf_bar(row) -%}
<div class="approve-bar">
    <span class="perf-regressed">⚠ perf regression{% if row.perf_summary %}: {{ row.perf_summary }}{% endif %}</span>
    {% if row.perf_approved %}
    <span class="approved-badge">✓ perf approved</span>
    {% else %}
    <button class="approve-btn" onclick="approvePerf(this)">Approve perf</button>
    {% endif %}
</div>
{%- endmacro %}
